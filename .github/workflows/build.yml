name: Build Standalone Executables

on:
  push:
    branches: [ "main", "master","portable" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build with PyInstaller
      # Use the same command logic as our build_windows.bat
      run: |
        python -m PyInstaller --noconsole --onefile --name tracker launcher.py
        
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tracker-windows
        path: dist/tracker.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build with PyInstaller
      # Use the same command logic as our build_macos.sh
      run: |
        python -m PyInstaller --noconsole --onefile --name tracker launcher.py
        
    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tracker-macos
        path: dist/tracker
