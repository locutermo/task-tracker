name: Build Standalone Executables

on:
  push:
    branches: [ "main", "master", "portable", "installer" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --noconsole --onefile --name tracker launcher.py
        
    - name: Compile Windows Installer (Inno Setup)
      uses: AmadeuszSzymko/Inno-Setup-Action@v1.2.2
      with:
        setup-file: setup.iss
        
    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: Instalador-Windows
        path: Output/InstaladorTracker.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build with PyInstaller
      run: |
        # Adjust path since launcher is in root
        python -m PyInstaller --noconsole --onefile --name tracker launcher.py
        
    - name: Create macOS Installer (.pkg)
      run: |
        chmod +x scripts/build/create_pkg.sh
        ./scripts/build/create_pkg.sh
        
    - name: Upload macOS Installer
      uses: actions/upload-artifact@v4
      with:
        name: Instalador-Mac-PKG
        path: tracker_installer.pkg
